<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt bàn - Nhà hàng Ẩm Thực Tinh Tế</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <header>
    <h1>Đặt bàn của bạn</h1>
  </header>

  <nav class="main-nav">
    <button class="menu-toggle" aria-label="Menu">
      <i class="fas fa-bars"></i>
    </button>
    <div class="nav-links">
      <div class="nav-group">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Trang chủ</a>
        <a href="about.html" class="nav-item"><i class="fas fa-info-circle"></i> Giới thiệu</a>
        <a href="menu.html" class="nav-item"><i class="fas fa-utensils"></i> Thực đơn</a>
      </div>
      <div class="nav-group">
        <a href="reservations.html" class="nav-item"><i class="fas fa-calendar-alt"></i> Đặt bàn</a>
        <a href="events.html" class="nav-item"><i class="fas fa-glass-cheers"></i> Sự kiện</a>
        <a href="gallery.html" class="nav-item"><i class="fas fa-images"></i> Thư viện ảnh</a>
      </div>
      <div class="nav-group">
        <a href="blog.html" class="nav-item"><i class="fas fa-blog"></i> Blog</a>
        <a href="careers.html" class="nav-item"><i class="fas fa-user-tie"></i> Tuyển dụng</a>
        <a href="contact.html" class="nav-item"><i class="fas fa-envelope"></i> Liên hệ</a>
      </div>
    </div>
  </nav>

  <section class="container">
    <div id="main" class="fade-in">
      <h2>Đặt bàn</h2>
      <p>Hãy để chúng tôi chuẩn bị một bàn hoàn hảo cho bạn</p>

      <form class="reservation-form fade-in">
        <div class="form-group">
          <label for="name">Tên:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Điện thoại:</label>
          <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Ngày:</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="form-group">
            <label for="time">Thời gian:</label>
            <input type="time" id="time" name="time" required>
          </div>
        </div>

        <div class="form-group">
          <label for="guests">Số lượng khách:</label>
          <input type="number" id="guests" name="guests" min="1" max="20" required>
        </div>

        <div class="form-group">
          <label for="message">Yêu cầu đặc biệt:</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <button type="submit" class="btn">Đặt bàn ngay</button>
      </form>
    </div>
  </section>

  <footer>
    <p>Bản quyền Nhà hàng Ẩm Thực Tinh Tế 2025 Thuộc về @ChienLe</p>
  </footer>
</body>

</html>
